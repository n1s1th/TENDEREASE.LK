spring:
  config:
    import: "optional:file:../.env[.properties]"
  application:
    name: user-service
  
  mail:
    host: localhost
    port: 2525
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tenderease_user_db?sslmode=require
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:amqps://ckjlipjh:hBXULY5GyLq-BcWm-_Tr7TGeVRSULquN@dog.lmq.cloudamqp.com/ckjlipjh}
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes in milliseconds

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tenderease}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/tenderease/protocol/openid-connect/certs}

  keycloak:
    admin:
      server-url: ${KEYCLOAK_ADMIN_URL:https://lemur-1.cloud-iam.com/auth}
      realm: ${KEYCLOAK_REALM:tenderease}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:tenderease-backend}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:UdiHyV4TMypLJQqBsqOXDrltJaG5TK7O}

server:
  port: ${PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    oauth:
      client-id: tenderease-client
      use-pkce-with-authorization-code-grant: true

logging:
  level:
    lk.tenderease: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ──── Application Properties ────
app:
  name: User Service
  version: 1.0.0

# ──── Officer Service Properties ────
officer:
  registration:
    reference-prefix: "OFF"
    support-prefix: "ERR-REG"
  cache:
    ttl-minutes: 10

# ──── RabbitMQ Exchange/Queue Names ────
rabbitmq:
  exchange:
    officer: officer.exchange
  queue:
    officer-registered: officer.registered.queue
    officer-approved: officer.approved.queue
    officer-rejected: officer.rejected.queue
    officer-notification: officer.notification.queue
  routing-key:
    officer-registered: officer.registered
    officer-approved: officer.approved
    officer-rejected: officer.rejected
