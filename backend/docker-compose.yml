# ──────────────────────────────────────────────────────────────
# TenderEase — Docker Compose (Development)
# Usage: docker compose up --build
# From:  backend/ directory
# ──────────────────────────────────────────────────────────────

services:

  # ════════════════════════════════════════════════════════════
  # Infrastructure
  # ════════════════════════════════════════════════════════════

  postgres:
    image: postgres:15-alpine
    container_name: tenderease-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tenderease-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: tenderease-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tenderease-network

  redis:
    image: redis:7-alpine
    container_name: tenderease-redis
    ports:
      - "6379:6379"
    networks:
      - tenderease-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: tenderease-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - tenderease-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: tenderease-keycloak
    command: start-dev
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/tenderease_keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/themes/tenderease:/opt/keycloak/themes/tenderease
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tenderease-network

  # ════════════════════════════════════════════════════════════
  # Service Discovery
  # ════════════════════════════════════════════════════════════

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: tenderease-eureka
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8761:8761"
    networks:
      - tenderease-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/" ]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # API Gateway
  # ════════════════════════════════════════════════════════════

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: tenderease-gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/tenderease
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/tenderease/protocol/openid-connect/certs
    ports:
      - "8000:8000"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - tenderease-network

  # ════════════════════════════════════════════════════════════
  # Microservices
  # ════════════════════════════════════════════════════════════

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: tenderease-user
