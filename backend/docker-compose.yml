version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-1
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tenderease-network

  redis:
    image: redis:7-alpine
    container_name: redis-1
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    ports:
      - "6379:6379"
    networks:
      - tenderease-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-1
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - tenderease-network

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: keycloak-1
    command: start-dev
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    environment:
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/themes/tenderease:/opt/keycloak/themes/tenderease
    depends_on:
      - postgres
    networks:
      - tenderease-network

networks:
  tenderease-network:
    driver: bridge

volumes:
  postgres_data:
