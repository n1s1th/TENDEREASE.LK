      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/tenderease
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/tenderease/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - tenderease-network

  tender-service:
    build:
      context: .
      dockerfile: tender-service/Dockerfile
    container_name: tenderease-tender
