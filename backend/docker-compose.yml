      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      EUREKA_CLIENT_ENABLED: "true"
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/tenderease
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/tenderease/protocol/openid-connect/certs
      USER_SERVICE_URL: http://user-service:8081
      WORKFLOW_SERVICE_URL: http://workflow-service:8085
      DOCUMENT_SERVICE_URL: http://document-service:8088
    ports:
      - "8082:8082"
    volumes:
      - tender_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
