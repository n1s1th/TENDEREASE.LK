spring:
  application:
    name: tender-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tenderease_tender_db?sslmode=require
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:kgum}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:amqps://ckjlipjh:hBXULY5GyLq-BcWm-_Tr7TGeVRSULquN@dog.lmq.cloudamqp.com/ckjlipjh}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tenderease}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/tenderease/protocol/openid-connect/certs}

server:
  port: ${PORT:8082}
  error:
    include-message: always
    include-binding-errors: always

eureka:
  client:
    enabled: false # 👈 ADD THIS LINE
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30

# External service URLs
services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  workflow-service:
    url: ${WORKFLOW_SERVICE_URL:http://localhost:8083}
  document-service:
    url: ${DOCUMENT_SERVICE_URL:http://localhost:8084}

# RabbitMQ topology
rabbitmq:
  exchanges:
    tender: tender.exchange
  routing-keys:
    tender-created: tender.created
    tender-submitted: tender.submitted
  queues:
    workflow-approved: tender.workflow.approved.queue
    workflow-rejected: tender.workflow.rejected.queue

# Redis cache configuration
cache:
  names:
    - tender-reference-ministries
    - tender-reference-departments
    - tender-reference-funding-sources
    - tender-reference-sbd-templates
    - tender-detail
    - tender-notice-preview

# Swagger / SpringDoc
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    oauth:
      client-id: tenderease-client
      use-pkce-with-authorization-code-grant: true

logging:
  level:
    lk.tenderease: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  name: Tender Service
  version: 1.0.0
  upload-dir: "C:\\Users\\Peduru\\Desktop\\TENDEREASE.LK\\backend\\uploads"
  mail:
    from: ${MAIL_FROM:no-reply@tenderease.lk}
