# ──────────────────────────────────────────────────────────────
# TenderEase — API Gateway · PROD profile (Google Cloud Run)
# Activated with SPRING_PROFILES_ACTIVE=prod
#
# On Cloud Run there is no Eureka. Routes target the deployed
# *.run.app URLs, injected as env vars by deploy.sh (phase 2).
# This file fully overrides the routes from application.yml.
# ──────────────────────────────────────────────────────────────
server:
  # Cloud Run sends traffic to $PORT (defaults to 8080).
  port: ${PORT:8080}

spring:
  cloud:
    gateway:
      # Disable Eureka-based route discovery.
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service-users
          uri: ${USER_SERVICE_URI}
          predicates:
            - Path=/api/users/**
        - id: user-service-vendors
          uri: ${USER_SERVICE_URI}
          predicates:
            - Path=/api/v1/vendors/**
        - id: cao-users
          uri: ${USER_SERVICE_URI}
          predicates:
            - Path=/api/cao/officers/**, /api/cao/registrations/**

        - id: tender-service
          uri: ${TENDER_SERVICE_URI}
          predicates:
            - Path=/api/tenders/**
        - id: cao-tenders
          uri: ${TENDER_SERVICE_URI}
          predicates:
            - Path=/api/cao/tenders/**

        - id: cao-kpi
          uri: ${REPORTING_SERVICE_URI}
          predicates:
            - Path=/api/cao/kpi/**

        - id: cao-notifications
          uri: ${NOTIFICATION_SERVICE_URI}
          predicates:
            - Path=/api/cao/notifications/**

        - id: cao-audit
          uri: ${WORKFLOW_SERVICE_URI}
          predicates:
            - Path=/api/cao/audit-logs/**

      globalcors:
        cors-configurations:
          '[/**]':
            # Comma-separated list of allowed frontend origins, e.g.
            # ALLOWED_ORIGINS=https://app.tenderease.lk,https://tenderease.web.app
            allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: ["*"]
            allow-credentials: true
            max-age: 3600

# Don't try to reach Eureka in the cloud.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
